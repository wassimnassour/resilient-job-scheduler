spring.application.name=resilient-job-scheduler
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jobscheduler}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:jobscheduler}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:jobscheduler}
spring.jpa.hibernate.ddl-auto=update
scheduler.poll-interval-ms=5000
scheduler.batch-size=50
